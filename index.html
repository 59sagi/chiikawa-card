<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>치이카와 프로필 카드 메이커</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  @font-face {
    font-family: 'OwnglyphYuntaeng';
    src: url('https://cdn.jsdelivr.net/gh/Project-Noonnu/2608211801@font-160/font-160/온글잎 윤탱체.woff2') format('woff2');
    font-weight: 400;
    font-display: swap;
  }
  :root{
    --cream:#FFFCF3;
    --paper:#FFFFFF;
    --ink:#2E2620;
    --brown:#4A3626;
    --green:#AFD98F;
    --pink:#F8CBDD;
    --yellow:#FBE28E;
    --sky:#BFE3F2;
    --line:#2E2620;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    padding:24px 16px 60px;
    background:
      radial-gradient(circle at 12% 8%, rgba(175,217,143,0.35) 0, transparent 40%),
      radial-gradient(circle at 88% 15%, rgba(248,203,221,0.4) 0, transparent 40%),
      radial-gradient(circle at 50% 95%, rgba(191,227,242,0.35) 0, transparent 45%),
      var(--cream);
    font-family:'Nanum Gothic', sans-serif;
    color:var(--ink);
    min-height:100vh;
  }
  .wrap{max-width:760px;margin:0 auto;}
  h1{
    font-family:'OwnglyphYuntaeng', 'Nanum Gothic', sans-serif;
    font-weight:400;
    font-size:34px;
    text-align:center;
    margin:4px 0 4px;
    letter-spacing:-0.5px;
  }
  .sub{
    text-align:center;
    font-size:14px;
    color:#7a6a5a;
    margin:0 0 22px;
  }
  .card-box{
    background:var(--paper);
    border:3px solid var(--ink);
    border-radius:28px 32px 26px 34px/34px 24px 32px 26px;
    box-shadow:6px 6px 0 rgba(46,38,32,0.08);
    padding:20px;
    margin-bottom:20px;
  }
  .card-box h2{
    font-family:'OwnglyphYuntaeng', sans-serif;
    font-size:22px;
    margin:0 0 14px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .badge{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:26px;height:26px;
    background:var(--green);
    border:2px solid var(--ink);
    border-radius:50%;
    font-size:14px;
    font-weight:800;
    flex:none;
  }
  /* photo uploader */
  .photo-row{display:flex;align-items:center;gap:18px;flex-wrap:wrap;}
  .photo-slot{
    width:110px;height:110px;
    border-radius:24px;
    border:3px dashed #cbb99e;
    background:#FFFAF0;
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
    flex:none;
    position:relative;
  }
  .photo-slot img{width:100%;height:100%;object-fit:cover;display:block;}
  .photo-slot .ph-icon{font-size:28px;opacity:0.5;}
  .photo-actions{display:flex;flex-direction:column;gap:8px;}
  .btn{
    font-family:'Nanum Gothic', sans-serif;
    font-weight:800;
    font-size:14px;
    border:2.5px solid var(--ink);
    background:var(--yellow);
    color:var(--ink);
    padding:10px 16px;
    border-radius:14px;
    cursor:pointer;
    box-shadow:3px 3px 0 rgba(46,38,32,0.15);
    transition:transform .08s ease;
  }
  .btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 rgba(46,38,32,0.15);}
  .btn.ghost{background:var(--paper);}
  .btn.pink{background:var(--pink);}
  .btn.sky{background:var(--sky);}
  .btn.small{padding:6px 12px;font-size:12.5px;border-radius:10px;}
  .btn:disabled{opacity:0.45;cursor:not-allowed;box-shadow:none;}
  .hint{font-size:12.5px;color:#8a7a68;margin-top:6px;}
  input[type=file]{display:none;}
  /* name input */
  .name-input-row{display:flex;align-items:center;gap:10px;}
  input[type=text]{
    flex:1;
    font-family:'Nanum Gothic', sans-serif;
    font-size:16px;
    font-weight:700;
    padding:12px 14px;
    border-radius:14px;
    border:2.5px solid var(--ink);
    outline:none;
    background:#FFFEFA;
  }
  input[type=text]:focus{background:#FFFDF2;}
  .counter{font-size:12.5px;color:#8a7a68;white-space:nowrap;}
  /* character grid */
  .grid-toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px;}
  .sel-count{font-size:13px;color:#7a6a5a;font-weight:700;}
  .char-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(64px,1fr));
    gap:10px;
  }
  .char-btn{
    border:none;
    background:none;
    padding:0;
    cursor:pointer;
    border-radius:50%;
    position:relative;
    aspect-ratio:1/1;
  }
  .char-btn img{
    width:100%;height:100%;
    border-radius:50%;
    display:block;
    border:3px solid transparent;
    transition:opacity .15s ease, border-color .15s ease, transform .1s ease;
  }
  .char-btn.active img{
    opacity:1;
    border-color:var(--ink);
    box-shadow:2px 2px 0 rgba(46,38,32,0.2);
  }
  .char-btn:not(.active) img{opacity:0.3;}
  .char-btn:active img{transform:scale(0.94);}
  /* generate button */
  .generate-wrap{text-align:center;margin:26px 0;}
  .btn.generate{
    font-size:18px;
    padding:16px 40px;
    background:var(--green);
    border-radius:20px;
    box-shadow:4px 4px 0 rgba(46,38,32,0.18);
  }
  /* result */
  .result-box{display:none;}
  .result-box.show{display:block;}
  .result-img-wrap{
    border-radius:20px;
    overflow:hidden;
    border:3px solid var(--ink);
    margin-bottom:16px;
    line-height:0;
  }
  .result-img-wrap img{width:100%;display:block;}
  .result-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}
  .footer-note{text-align:center;font-size:12px;color:#a0917f;margin-top:26px;}
  canvas{display:none;}
</style>
</head>
<body>
<div class="wrap">
  <h1>치이카와 프로필 카드 메이커</h1>

  <div class="card-box">
    <h2><span class="badge">1</span>사진 (선택)</h2>
    <p class="hint">사진은 가운데를 기준, 정사각형으로 자동 크롭돼요.</p>
    <div class="photo-row">
      <div class="photo-slot" id="photoSlot">
        <span class="ph-icon">🖼️</span>
        <img id="photoPreview" style="display:none;">
      </div>
      <div class="photo-actions">
        <button class="btn" id="uploadBtn">사진 업로드</button>
        <button class="btn ghost small" id="removePhotoBtn" style="display:none;">사진 지우기</button>
        <input type="file" id="photoInput" accept="image/*">
      </div>
    </div>
  </div>

  <div class="card-box">
    <h2><span class="badge">2</span>이름 (선택, 최대 9자)</h2>
    <div class="name-input-row">
      <input type="text" id="nameInput" maxlength="9" placeholder="예: 하치와레">
      <span class="counter"><span id="nameCount">0</span>/9</span>
    </div>
  </div>

  <div class="card-box">
    <h2><span class="badge">3</span>최애 캐릭터 (선택, 다중 선택 가능)</h2>
    <div class="grid-toolbar">
      <span class="sel-count"><span id="selCount">0</span> 선택됨</span>
      <div style="display:flex;gap:8px;">
        <button class="btn sky small" id="selectAllBtn">전체선택</button>
        <button class="btn ghost small" id="deselectAllBtn">전체해제</button>
      </div>
    </div>
    <div class="char-grid" id="charGrid"></div>
  </div>

  <div class="generate-wrap">
    <button class="btn generate" id="generateBtn">✨ 카드 생성하기</button>
  </div>

  <div class="card-box result-box" id="resultBox">
    <h2><span class="badge">✓</span>완성된 카드</h2>
    <div class="result-img-wrap">
      <img id="resultImg">
    </div>
    <div class="result-actions">
      <button class="btn pink" id="saveBtn">이미지 저장</button>
      <button class="btn sky" id="shareBtn">X에 공유하기</button>
    </div>
    <p class="hint" id="shareHint" style="text-align:center;display:none;"></p>
  </div>

  <p class="footer-note">제작: @59sagi<br>©nagano</p>
</div>

// ---------- state ----------
let croppedPhotoDataURL = null;
let selected = new Array(CHAR_IMAGES.length).fill(false);

// ---------- build character grid ----------
const charGridEl = document.getElementById('charGrid');
CHAR_IMAGES.forEach((c, i) => {
  const btn = document.createElement('button');
  btn.className = 'char-btn';
  btn.setAttribute('aria-pressed','false');
  const img = document.createElement('img');
  img.src = c.src;
  img.alt = '캐릭터 ' + (i+1);
  btn.appendChild(img);
  btn.addEventListener('click', () => {
    selected[i] = !selected[i];
    btn.classList.toggle('active', selected[i]);
    updateSelCount();
  });
  charGridEl.appendChild(btn);
});

function updateSelCount(){
  const n = selected.filter(Boolean).length;
  document.getElementById('selCount').textContent = n;
}

document.getElementById('selectAllBtn').addEventListener('click', () => {
  selected = selected.map(() => true);
  document.querySelectorAll('.char-btn').forEach(b => b.classList.add('active'));
  updateSelCount();
});
document.getElementById('deselectAllBtn').addEventListener('click', () => {
  selected = selected.map(() => false);
  document.querySelectorAll('.char-btn').forEach(b => b.classList.remove('active'));
  updateSelCount();
});

// ---------- name input ----------
const nameInput = document.getElementById('nameInput');
nameInput.addEventListener('input', () => {
  document.getElementById('nameCount').textContent = nameInput.value.length;
});

// ---------- photo upload & center crop ----------
const photoInput = document.getElementById('photoInput');
const photoPreview = document.getElementById('photoPreview');
const phIcon = document.querySelector('.ph-icon');
const removePhotoBtn = document.getElementById('removePhotoBtn');

document.getElementById('uploadBtn').addEventListener('click', () => photoInput.click());

photoInput.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    const img = new Image();
    img.onload = () => {
      const side = Math.min(img.width, img.height);
      const sx = (img.width - side)/2;
      const sy = (img.height - side)/2;
      const c = document.createElement('canvas');
      c.width = 480; c.height = 480;
      const ctx = c.getContext('2d');
      ctx.drawImage(img, sx, sy, side, side, 0, 0, 480, 480);
      croppedPhotoDataURL = c.toDataURL('image/png');
      photoPreview.src = croppedPhotoDataURL;
      photoPreview.style.display = 'block';
      phIcon.style.display = 'none';
      removePhotoBtn.style.display = 'inline-block';
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
});

removePhotoBtn.addEventListener('click', () => {
  croppedPhotoDataURL = null;
  photoPreview.style.display = 'none';
  phIcon.style.display = 'block';
  removePhotoBtn.style.display = 'none';
  photoInput.value = '';
});

// ---------- helpers ----------
function loadImage(src){
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = src;
  });
}

function roundRectPath(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
}

async function ensureFont(){
  try{
    await document.fonts.load('400 60px OwnglyphYuntaeng');
    await document.fonts.ready;
  }catch(e){ /* fallback silently */ }
}

// ---------- generate ----------
const canvas = document.getElementById('workCanvas');
const ctx = canvas.getContext('2d');

async function generateCard(){
  const genBtn = document.getElementById('generateBtn');
  genBtn.disabled = true;
  genBtn.textContent = '생성 중...';

  await ensureFont();

  const bg = await loadImage(FRAME_BG);
  ctx.clearRect(0,0,canvas.width, canvas.height);
  ctx.drawImage(bg, 0, 0, canvas.width, canvas.height);

  // 선택되지 않은 캐릭터는 20% opacity처럼 보이도록 흰색 반투명 오버레이 처리
  ctx.fillStyle = 'rgba(255,255,255,0.8)';
  GRID_POS.forEach((p, i) => {
    if(!selected[i]){
      ctx.beginPath();
      ctx.arc(p.x, p.y, ERASE_R, 0, Math.PI*2);
      ctx.fill();
    }
  });

  // draw photo
  if(croppedPhotoDataURL){
    const photo = await loadImage(croppedPhotoDataURL);
    ctx.save();
    roundRectPath(ctx, PHOTO_BOX.x, PHOTO_BOX.y, PHOTO_BOX.w, PHOTO_BOX.h, PHOTO_BOX.r);
    ctx.clip();
    ctx.drawImage(photo, PHOTO_BOX.x, PHOTO_BOX.y, PHOTO_BOX.w, PHOTO_BOX.h);
    ctx.restore();
  }

  // draw name
  const name = nameInput.value.trim();
  if(name){
    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#3A2A1E';
    let fontSize = 128;
    ctx.font = `400 ${fontSize}px 'OwnglyphYuntaeng', 'Nanum Gothic', sans-serif`;
    let width = ctx.measureText(name).width;
    const maxWidth = 620;
    while(width > maxWidth && fontSize > 24){
      fontSize -= 2;
      ctx.font = `400 ${fontSize}px 'OwnglyphYuntaeng', 'Nanum Gothic', sans-serif`;
      width = ctx.measureText(name).width;
    }
    ctx.fillText(name, NAME_CENTER.x, NAME_CENTER.y);
    ctx.restore();
  }

  const dataURL = canvas.toDataURL('image/png');
  document.getElementById('resultImg').src = dataURL;
  document.getElementById('resultBox').classList.add('show');
  document.getElementById('resultBox').scrollIntoView({behavior:'smooth', block:'start'});

  genBtn.disabled = false;
  genBtn.textContent = '✨ 카드 생성하기';
}

document.getElementById('generateBtn').addEventListener('click', generateCard);

// ---------- save / share ----------
function canvasToBlob(){
  return new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
}

document.getElementById('saveBtn').addEventListener('click', async () => {
  const blob = await canvasToBlob();
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = '치이카와_프로필카드.png';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 3000);
});

const HASHTAG_TEXT = '#치이카와트친소 #치이카와_트친소 #먼작귀트친소 #먼작귀_트친소';

document.getElementById('shareBtn').addEventListener('click', async () => {
  const shareHint = document.getElementById('shareHint');
  shareHint.style.display = 'none';
  const blob = await canvasToBlob();
  const file = new File([blob], '치이카와_프로필카드.png', {type:'image/png'});

  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{
      await navigator.share({files:[file], text: HASHTAG_TEXT});
      return;
    }catch(e){
      // user cancelled share sheet — do nothing further
      if(e && e.name === 'AbortError') return;
    }
  }

  // fallback: download image + open X intent with hashtag text
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = '치이카와_프로필카드.png';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 3000);

  const intent = 'https://twitter.com/intent/tweet?text=' + encodeURIComponent(HASHTAG_TEXT);
  window.open(intent, '_blank');
  shareHint.textContent = '이미지가 저장되었어요. X가 열리면 저장된 이미지를 직접 첨부해주세요!';
  shareHint.style.display = 'block';
});
</script>
